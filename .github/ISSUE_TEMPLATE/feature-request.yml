name: Feature request
description: Suggest a focused improvement to Rift Traveler.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the player problem first, then the change you would like to see. Focused suggestions are easier to evaluate and test.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the gameplay, interface, compatibility, or administration problem.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how you would like the feature to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention existing mechanics or simpler approaches that might also solve it.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, screenshots, examples, or compatibility considerations.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: This request is about Rift Traveler rather than general Vintage Story support.
          required: true

